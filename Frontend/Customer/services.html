<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Services — Laundry Flow Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/booking.css" />
</head>
<body>

  <!-- ═══════════════════════════ NAVBAR ═══════════════════════════ -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon"><i class="fas fa-tshirt"></i></div>
        <span>Laundry<span class="brand-accent">Flow</span> Pro</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html"     class="nav-link">Home</a></li>
        <li><a href="services.html"  class="nav-link active">Services</a></li>
        <li><a href="profile.html"   class="nav-link">Profile</a></li>
      </ul>

      <div class="nav-actions" id="nav-actions">
        <div id="nav-guest">
          <a href="login.html"  class="btn btn-ghost">Login</a>
          <a href="signup.html" class="btn btn-primary">Get Started</a>
        </div>
        <div id="nav-auth" style="display:none;align-items:center;gap:0.75rem;">
          <a href="profile.html" class="btn btn-ghost" id="nav-profile-btn"
             style="display:flex;align-items:center;gap:0.4rem;">
            <i class="fas fa-user-circle" style="font-size:1.15rem;"></i>
            <span id="nav-user-greeting">Profile</span>
          </a>
          <button class="btn btn-primary" id="nav-logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════ CONTENT ══════════════════════════ -->
  <main class="booking-page">
    <div class="booking-container">

      <h1 class="booking-title">Choose a Service</h1>
      <p class="booking-sub">Select the service you need, then schedule your pickup.</p>

      <!-- Services Grid (populated by JS) -->
      <div class="services-grid" id="services-grid">
        <!-- Skeleton loaders -->
        <div class="svc-booking-card" style="min-height:220px;">
          <div class="skeleton" style="height:40px;width:40px;border-radius:8px;"></div>
          <div class="skeleton" style="height:18px;width:60%;"></div>
          <div class="skeleton" style="height:14px;width:90%;"></div>
          <div class="skeleton" style="height:14px;width:75%;"></div>
          <div class="skeleton" style="height:42px;border-radius:50px;"></div>
        </div>
        <div class="svc-booking-card" style="min-height:220px;">
          <div class="skeleton" style="height:40px;width:40px;border-radius:8px;"></div>
          <div class="skeleton" style="height:18px;width:60%;"></div>
          <div class="skeleton" style="height:14px;width:90%;"></div>
          <div class="skeleton" style="height:14px;width:75%;"></div>
          <div class="skeleton" style="height:42px;border-radius:50px;"></div>
        </div>
        <div class="svc-booking-card" style="min-height:220px;">
          <div class="skeleton" style="height:40px;width:40px;border-radius:8px;"></div>
          <div class="skeleton" style="height:18px;width:60%;"></div>
          <div class="skeleton" style="height:14px;width:90%;"></div>
          <div class="skeleton" style="height:14px;width:75%;"></div>
          <div class="skeleton" style="height:42px;border-radius:50px;"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Toast notification -->
  <div id="toast-wrap"></div>

  <script src="js/config.js"></script>
  <script src="js/notif-bell.js"></script>
  <script src="js/services.js"></script>
</body>
</html>
